<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>draftsync collection</title>
    <link rel="icon" href="/assets/heron.svg" />
    <link rel="stylesheet" href="/assets/tokens.css" />
    <link rel="stylesheet" href="/assets/draftsync.css" />
    <script src="/assets/feed.js" defer></script>
    <style>
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .layout > main {
        flex: 1;
        overflow-y: auto;
      }
      header .desc {
        color: var(--ink-soft);
        font-size: 0.85rem;
        flex: 1;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        background: var(--paper-raised);
        border: 1px solid var(--ink-faint);
        border-radius: var(--radius);
        padding: 0.45rem 0.8rem;
        margin-bottom: 0.4rem;
      }
      .row.muted {
        background: var(--paper-sunken);
        border-style: dashed;
      }
      .row span.t {
        flex: 1;
      }
      .row.muted span.t {
        color: var(--ink-soft);
      }
      .row a {
        text-decoration: none;
        font-weight: 600;
      }
      .row button,
      .edition button {
        padding: 0.15rem 0.55rem;
        font-size: 0.78rem;
      }
      .downloads {
        display: flex;
        gap: 0.6rem;
        font-size: 0.85rem;
        align-items: baseline;
      }
      .edition {
        border: 1px solid var(--ink-faint);
        border-radius: var(--radius-large);
        padding: 0.8rem 1rem;
        margin-bottom: 0.8rem;
        background: var(--paper-raised);
      }
      .edition .head {
        display: flex;
        gap: 0.6rem;
        align-items: baseline;
        margin-bottom: 0.4rem;
      }
      .edition .head strong {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">← Projects</a>
      <h1>
        <img class="logo" src="/assets/heron.svg" alt="" /> <span id="col-name">collection</span>
      </h1>
      <span class="desc" id="col-desc"></span>
      <span class="downloads">
        <span style="color: var(--muted)">Download all:</span>
        <a id="dl-epub" download>EPUB</a>
        <a id="dl-docx" download>DOCX</a>
        <a id="dl-pdf" download>PDF</a>
      </span>
      <button id="tasks-toggle">
        <svg class="ic"><use href="/assets/icons.svg#square" /></svg>
        <span id="tasks-toggle-label">Tasks</span>
      </button>
      <button id="panel-toggle">
        <svg class="ic"><use href="/assets/icons.svg#pulse" /></svg>
        Activity
      </button>
    </header>
    <div class="layout">
      <main>
        <h2>Stories, in order</h2>
        <div id="members"></div>
        <h2>Add a project</h2>
        <div id="available"></div>
        <h2 style="display: flex; justify-content: space-between">
          <span>Editions</span>
          <button id="ed-new" style="text-transform: none; letter-spacing: 0">New edition</button>
        </h2>
        <div id="editions"></div>
      </main>
      <aside class="apanel" id="tpanel">
        <div class="apanel-head">
          <strong style="font-size: 0.85rem">Open tasks — this collection</strong>
        </div>
        <div class="apanel-list" id="tpanel-list"></div>
      </aside>
      <aside class="apanel" id="apanel">
        <div class="apanel-head">
          <strong style="font-size: 0.85rem">Activity — this collection</strong>
        </div>
        <div class="apanel-list" id="apanel-list"></div>
      </aside>
    </div>

    <script>
      const collectionId = Number(location.pathname.split('/')[2]);
      const base = `/api/collections/${collectionId}`;
      let state = null;

      const api = async (path, method = 'GET', body) => {
        const res = await fetch(path, {
          method,
          headers: body ? { 'Content-Type': 'application/json' } : {},
          body: body ? JSON.stringify(body) : undefined
        });
        if (!res.ok) throw new Error((await res.json()).error || res.statusText);
        return res.json();
      };

      const load = async () => {
        state = await api(base);
        document.getElementById('col-name').textContent = state.collection.name;
        document.getElementById('col-desc').textContent = state.collection.description;
        document.title = state.collection.name + ' · draftsync collection';
        for (const fmt of ['epub', 'docx', 'pdf']) {
          document.getElementById(`dl-${fmt}`).href = `${base}/export/${fmt}`;
        }
        renderMembers();
        renderEditions();
      };

      const setMembers = async ids => {
        await api(`${base}/projects`, 'PUT', { project_ids: ids });
        load();
      };

      const renderMembers = () => {
        const ids = state.projects.map(prj => prj.id);
        const root = document.getElementById('members');
        root.innerHTML = '';
        state.projects.forEach((prj, i) => {
          const row = document.createElement('div');
          row.className = 'row';
          const up = document.createElement('button');
          up.textContent = '▲';
          up.disabled = i === 0;
          up.addEventListener('click', () => {
            const next = [...ids];
            [next[i - 1], next[i]] = [next[i], next[i - 1]];
            setMembers(next);
          });
          const down = document.createElement('button');
          down.textContent = '▼';
          down.disabled = i === ids.length - 1;
          down.addEventListener('click', () => {
            const next = [...ids];
            [next[i], next[i + 1]] = [next[i + 1], next[i]];
            setMembers(next);
          });
          const t = document.createElement('span');
          t.className = 't';
          t.innerHTML = `${i + 1}. <a href="/p/${prj.id}">${prj.name}</a>`;
          const rm = document.createElement('button');
          rm.textContent = '×';
          rm.addEventListener('click', () => setMembers(ids.filter(x => x !== prj.id)));
          row.append(up, down, t, rm);
          root.appendChild(row);
        });
        if (state.projects.length === 0) {
          root.innerHTML =
            '<div class="row muted"><span class="t">Empty — add projects below</span></div>';
        }

        const avail = document.getElementById('available');
        avail.innerHTML = '';
        for (const prj of state.allProjects.filter(x => !ids.includes(x.id))) {
          const row = document.createElement('div');
          row.className = 'row muted';
          const add = document.createElement('button');
          add.textContent = '+';
          add.addEventListener('click', () => setMembers([...ids, prj.id]));
          const t = document.createElement('span');
          t.className = 't';
          t.textContent = prj.name + (prj.label ? ` (${prj.label})` : '');
          row.append(add, t);
          avail.appendChild(row);
        }
      };

      const renderEditions = async () => {
        const root = document.getElementById('editions');
        root.innerHTML = '';
        for (const ed of state.editions) {
          const { projects } = await api(`${base}/editions/${ed.id}`);
          const ids = projects.map(prj => prj.id);
          const setEd = async next => {
            await api(`${base}/editions/${ed.id}/projects`, 'PUT', { project_ids: next });
            load();
          };
          const box = document.createElement('div');
          box.className = 'edition';
          const head = document.createElement('div');
          head.className = 'head';
          head.innerHTML =
            `<strong>${ed.name}</strong>` +
            `<span class="downloads"><a href="${base}/export/epub?edition=${ed.id}" download>EPUB</a>` +
            `<a href="${base}/export/docx?edition=${ed.id}" download>DOCX</a>` +
            `<a href="${base}/export/pdf?edition=${ed.id}" download>PDF</a></span>`;
          const del = document.createElement('button');
          del.className = 'danger';
          del.textContent = 'Delete';
          del.addEventListener('click', async () => {
            if (!confirm(`Delete edition "${ed.name}"?`)) return;
            await api(`${base}/editions/${ed.id}`, 'DELETE');
            load();
          });
          head.appendChild(del);
          box.appendChild(head);

          projects.forEach((prj, i) => {
            const row = document.createElement('div');
            row.className = 'row';
            const up = document.createElement('button');
            up.textContent = '▲';
            up.disabled = i === 0;
            up.addEventListener('click', () => {
              const next = [...ids];
              [next[i - 1], next[i]] = [next[i], next[i - 1]];
              setEd(next);
            });
            const down = document.createElement('button');
            down.textContent = '▼';
            down.disabled = i === ids.length - 1;
            down.addEventListener('click', () => {
              const next = [...ids];
              [next[i], next[i + 1]] = [next[i + 1], next[i]];
              setEd(next);
            });
            const t = document.createElement('span');
            t.className = 't';
            t.textContent = `${i + 1}. ${prj.name}`;
            const rm = document.createElement('button');
            rm.textContent = '×';
            rm.addEventListener('click', () => setEd(ids.filter(x => x !== prj.id)));
            row.append(up, down, t, rm);
            box.appendChild(row);
          });
          for (const prj of state.projects.filter(x => !ids.includes(x.id))) {
            const row = document.createElement('div');
            row.className = 'row muted';
            const add = document.createElement('button');
            add.textContent = '+';
            add.addEventListener('click', () => setEd([...ids, prj.id]));
            const t = document.createElement('span');
            t.className = 't';
            t.textContent = prj.name;
            row.append(add, t);
            box.appendChild(row);
          }
          root.appendChild(box);
        }
        if (state.editions.length === 0) {
          root.innerHTML =
            '<div class="row muted"><span class="t">No editions — an edition selects and orders stories for an anthology build</span></div>';
        }
      };

      document.getElementById('ed-new').addEventListener('click', async () => {
        const name = prompt('Edition name:');
        if (!name || !name.trim()) return;
        try {
          await api(`${base}/editions`, 'POST', { name: name.trim() });
          load();
        } catch (e) {
          alert(e.message);
        }
      });

      /* ---- collection-scoped flyouts ---- */
      const setPanelMode = mode => {
        document.body.classList.toggle('panel-activity', mode === 'activity');
        document.body.classList.toggle('panel-tasks', mode === 'tasks');
        localStorage.setItem('draftsync-col-panel', mode || '');
        if (mode === 'activity') loadStream();
        if (mode === 'tasks') renderTasksPanel();
      };
      const panelMode = () =>
        document.body.classList.contains('panel-activity')
          ? 'activity'
          : document.body.classList.contains('panel-tasks')
            ? 'tasks'
            : null;
      document
        .getElementById('panel-toggle')
        .addEventListener('click', () =>
          setPanelMode(panelMode() === 'activity' ? null : 'activity')
        );
      document
        .getElementById('tasks-toggle')
        .addEventListener('click', () => setPanelMode(panelMode() === 'tasks' ? null : 'tasks'));

      const loadStream = async () => {
        const { stream } = await api(`/api/activity?collection=${collectionId}&limit=60`);
        dsFeed.renderStream(document.getElementById('apanel-list'), stream, { seenAt: null });
      };

      const renderTasksPanel = async () => {
        const { tasks } = await api('/api/tasks');
        const memberIds = new Set(state.projects.map(prj => prj.id));
        const mine = tasks.filter(t => memberIds.has(t.projectId));
        document.getElementById('tasks-toggle-label').textContent =
          mine.length > 0 ? `Tasks (${mine.length})` : 'Tasks';
        const list = document.getElementById('tpanel-list');
        list.innerHTML = '';
        for (const t of mine) {
          const row = document.createElement('div');
          row.className = 'ptask';
          const check = document.createElement('input');
          check.type = 'checkbox';
          check.addEventListener('change', async () => {
            await api(`/api/p/${t.projectId}/tasks/${t.id}`, 'PATCH', { done: true });
            renderTasksPanel();
          });
          const body = document.createElement('div');
          body.className = 'body';
          const txt = document.createElement('span');
          txt.className = 'txt';
          txt.textContent = t.text;
          const where = document.createElement('a');
          where.className = 'where';
          where.href = `/p/${t.projectId}`;
          where.textContent = t.projectName + (t.chapterTitle ? ` · ${t.chapterTitle}` : '');
          body.append(txt, where);
          row.append(check, body);
          list.appendChild(row);
        }
        if (mine.length === 0) {
          list.innerHTML =
            '<div class="ptask"><span class="txt" style="color: var(--muted)">No open tasks in this collection.</span></div>';
        }
      };

      (async () => {
        await load();
        renderTasksPanel();
        const saved = localStorage.getItem('draftsync-col-panel');
        if (saved) setPanelMode(saved);
      })();
    </script>
  </body>
</html>
