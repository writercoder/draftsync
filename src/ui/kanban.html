<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>draftsync board</title>
    <link rel="icon" href="/assets/heron.svg" />
    <link rel="stylesheet" href="/assets/tokens.css" />
    <link rel="stylesheet" href="/assets/draftsync.css" />
    <style>
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header .path {
        color: var(--ink-soft);
        font-size: 0.8rem;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .layout {
        flex: 1;
        display: flex;
        overflow: hidden;
        min-height: 0;
      }
      .apanel {
        width: 330px;
        flex: none;
        border-left: 1px solid var(--ink-faint);
        background: var(--paper-raised);
        display: none;
        flex-direction: column;
        min-height: 0;
      }
      body.panel-open .apanel {
        display: flex;
      }
      body.panel-open #panel-toggle {
        border-color: var(--infra);
        color: var(--infra);
      }
      .apanel-head {
        display: flex;
        gap: 0.35rem;
        padding: 0.7rem 0.9rem;
        border-bottom: 1px solid var(--ink-faint);
        flex-wrap: wrap;
      }
      .chipbtn {
        font-size: 0.72rem;
        font-weight: 600;
        border-radius: 999px;
        padding: 0.1rem 0.6rem;
        color: var(--ink-soft);
      }
      .chipbtn.active {
        color: var(--infra);
        border-color: var(--infra);
      }
      .chipbtn.ai.active {
        color: var(--ai-pink);
        border-color: var(--ai-pink);
        background: var(--ai-wash);
      }
      .apanel-actions {
        display: flex;
        gap: 0.4rem;
        padding: 0.5rem 0.9rem;
        border-bottom: 1px solid var(--ink-faint);
        flex-wrap: wrap;
      }
      .apanel-actions button {
        font-size: 0.75rem;
        padding: 0.2rem 0.55rem;
      }
      .apanel-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.4rem 0.9rem 1rem;
      }
      .st-item {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        padding: 0.4rem 0;
        border-bottom: 1px solid var(--ink-faint);
        font-size: 0.82rem;
      }
      .st-item .when {
        color: var(--ink-soft);
        font-size: 0.68rem;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        font-family: var(--font-mono);
      }
      .st-item .kind {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--infra);
        white-space: nowrap;
      }
      .st-item .kind.ai {
        color: var(--ai-pink);
      }
      .st-item .what {
        flex: 1;
      }
      .st-item .ok {
        color: var(--ai-green);
      }
      .st-item .warn {
        color: var(--ai-orange);
      }

      /* Board — PM infrastructure */
      .board {
        flex: 1;
        display: flex;
        gap: 0.9rem;
        padding: 1.1rem 1.5rem 1.5rem;
        overflow-x: auto;
        align-items: flex-start;
      }
      .column {
        background: var(--paper-sunken);
        border-radius: var(--radius-large);
        min-width: 240px;
        width: 240px;
        max-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .column h2 {
        margin: 0;
        padding: 0.75rem 0.9rem 0.4rem;
        display: flex;
        justify-content: space-between;
      }
      .cards {
        padding: 0.3rem 0.6rem;
        overflow-y: auto;
        min-height: 2.2rem;
        flex: 1;
      }
      .card {
        background: var(--paper-raised);
        border: 1px solid var(--ink-faint);
        border-radius: var(--radius);
        padding: 0.5rem 0.7rem;
        margin-bottom: 0.5rem;
        cursor: grab;
      }
      .card:hover {
        border-color: var(--infra);
      }
      .card.dragging {
        opacity: 0.4;
      }
      .cards.dragover {
        outline: 2px dashed var(--infra);
        outline-offset: -4px;
        border-radius: var(--radius);
      }
      .card .file {
        display: block;
        color: var(--ink-soft);
        font-family: var(--font-mono);
        font-size: 0.68rem;
        margin-top: 0.3rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .gdoc {
        display: inline-block;
        font-size: 0.72rem;
        color: var(--infra);
        text-decoration: none;
        margin-top: 0.25rem;
        margin-right: 0.4rem;
      }
      .card .gdoc:hover {
        text-decoration: underline;
      }

      /* Zone 1 — manuscript-derived text on cards */
      .card .excerpt {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-family: var(--font-authorly);
        color: var(--ink-soft);
        font-size: 0.78rem;
        line-height: 1.35;
        margin-top: 0.25rem;
      }
      .card .words {
        display: block;
        color: var(--ink-soft);
        font-size: 0.7rem;
        margin-top: 0.15rem;
        font-variant-numeric: tabular-nums;
      }

      .add {
        border: none;
        background: none;
        color: var(--ink-soft);
        text-align: left;
        padding: 0.4rem 0.9rem 0.7rem;
      }
      .add:hover {
        color: var(--infra);
      }
      .add-input {
        margin: 0 0.6rem 0.6rem;
        border-color: var(--infra);
        width: auto;
      }
      .empty {
        color: var(--ink-soft);
        padding: 2rem;
        text-align: center;
        font-size: 0.9rem;
      }

      /* Chips: tasks are zone 2, AI is zone 3 */
      .task-chip {
        display: inline-block;
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--infra-soft);
        border: 1px solid var(--ink-faint);
        border-radius: 999px;
        padding: 0 0.45rem;
        margin-top: 0.25rem;
        margin-right: 0.3rem;
      }
      .ai-chip {
        display: inline-block;
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--ai-pink);
        border: 1px solid var(--ai-pink);
        background: var(--ai-wash);
        border-radius: 999px;
        padding: 0 0.45rem;
        margin-top: 0.25rem;
      }

      /* Editions dialog */
      .ed-row {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        padding: 0.28rem 0;
        border-bottom: 1px solid var(--ink-faint);
        font-size: 0.9rem;
      }
      .ed-row span.t {
        flex: 1;
      }
      .ed-row.excluded span.t {
        color: var(--ink-soft);
      }
      .ed-row .nofile {
        color: var(--ink-soft);
        font-size: 0.72rem;
        font-style: italic;
      }
      .ed-row button {
        font-size: 0.72rem;
        padding: 0.05rem 0.45rem;
      }
      .ed-head {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.4rem;
      }
      .ed-head select {
        flex: 1;
        width: auto;
      }
      .ed-downloads {
        display: flex;
        gap: 0.6rem;
        margin: 0.6rem 0 0.2rem;
        font-size: 0.85rem;
      }
      .ed-section {
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin: 0.9rem 0 0.2rem;
      }

      /* Tasks in the chapter editor */
      #task-list .task {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        padding: 0.2rem 0;
        font-size: 0.88rem;
      }
      #task-list .task.done span {
        text-decoration: line-through;
        color: var(--ink-soft);
      }
      #task-list .task span {
        flex: 1;
      }
      #task-list .task button {
        font-size: 0.7rem;
        padding: 0.05rem 0.4rem;
      }
      #task-new {
        margin-top: 0.2rem;
      }

      /* Feed lists (AI log, reviews) */
      .ai-list {
        max-height: 14rem;
        overflow-y: auto;
        margin-top: 0.6rem;
        border-top: 1px solid var(--ink-faint);
      }
      .ai-event {
        border-bottom: 1px solid var(--ink-faint);
        padding: 0.5rem 0;
        font-size: 0.85rem;
      }
      .ai-event .meta {
        color: var(--ink-soft);
        font-size: 0.75rem;
      }
      .ai-event a {
        color: var(--ai-pink);
        overflow-wrap: anywhere;
      }
      .ai-event .just {
        font-style: italic;
        color: var(--ink-soft);
      }
      .ai-event button {
        float: right;
        font-size: 0.7rem;
        padding: 0.1rem 0.45rem;
      }
      #meta-content {
        min-height: 18rem;
        font-family: var(--font-mono);
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">← Projects</a>
      <h1>
        <img class="logo" src="/assets/heron.svg" alt="" />
        <span id="project-name">draftsync board</span>
      </h1>
      <span class="path" id="project-path"></span>
      <div class="menu" id="dl-menu">
        <button>Download ▾</button>
        <div class="menu-list">
          <a class="menu-item" id="dl-epub" download>EPUB</a>
          <a class="menu-item" id="dl-docx" download>DOCX</a>
          <a class="menu-item" id="dl-pdf" download>PDF</a>
          <div class="menu-sep"></div>
          <button class="menu-item" id="dl-editions">Edition builds… (Editions)</button>
        </div>
      </div>
      <div class="menu" id="actions-menu">
        <button>Actions ▾</button>
        <div class="menu-list">
          <button class="menu-item with-count" id="am-reviews-head">
            <span>Reviews</span><span class="count" id="am-reviews-count"></span>
          </button>
          <button class="menu-item" id="am-send">Send for review</button>
          <button class="menu-item" id="am-record">Record review</button>
          <div class="menu-sep"></div>
          <button class="menu-item with-count" id="am-editions-head">
            <span>Editions</span><span class="count" id="am-editions-count"></span>
          </button>
          <button class="menu-item" id="am-new-edition">New edition</button>
          <div class="menu-sep"></div>
          <div class="menu-head"><span>Project settings</span></div>
          <button class="menu-item" id="am-metadata">Metadata</button>
          <button class="menu-item" id="am-import">Import chapters</button>
          <button class="menu-item" id="am-ai">Log AI usage</button>
          <a class="menu-item" id="am-drive" target="_blank" style="display: none"
            >Drive folder ↗</a
          >
        </div>
      </div>
      <button id="panel-toggle">◨ Activity</button>
    </header>
    <div class="layout">
      <div class="board" id="board"></div>
      <aside class="apanel" id="apanel">
        <div class="apanel-head">
          <button class="chipbtn active" data-cat="all">All</button>
          <button class="chipbtn" data-cat="files">Files</button>
          <button class="chipbtn" data-cat="reviews">Reviews</button>
          <button class="chipbtn" data-cat="tasks">Tasks</button>
          <button class="chipbtn ai" data-cat="ai">AI</button>
        </div>
        <div class="apanel-actions">
          <button id="ap-send">＋ Send for review</button>
          <button id="ap-record">＋ Record review</button>
          <button id="ap-ai">＋ Log AI</button>
        </div>
        <div class="apanel-list" id="apanel-list"></div>
      </aside>
    </div>

    <dialog id="ai-dialog">
      <form id="ai-form">
        <strong>AI usage log</strong>
        <label for="ai-url">Chat session URL (claude.ai or chatgpt.com)</label>
        <input type="text" id="ai-url" placeholder="https://claude.ai/chat/…" />
        <label for="ai-purpose">Purpose</label>
        <select id="ai-purpose"></select>
        <label for="ai-card">Chapter (optional)</label>
        <select id="ai-card"></select>
        <label for="ai-just">Justification (required for prose-suggestion)</label>
        <textarea id="ai-just" placeholder="How the output was used, and why."></textarea>
        <div class="dialog-actions">
          <button type="button" id="ai-ingest">Import Claude Code usage</button>
          <span>
            <button type="button" id="ai-close">Close</button>
            <button type="submit" class="primary">Add link</button>
          </span>
        </div>
      </form>
      <div class="ai-list" id="ai-list"></div>
    </dialog>

    <dialog id="reviews-dialog">
      <form id="review-form">
        <strong>Reviews</strong>
        <label for="rv-name">Reviewer name</label>
        <input type="text" id="rv-name" required />
        <label for="rv-email">Reviewer email</label>
        <input type="text" id="rv-email" required />
        <label for="rv-target">Of</label>
        <select id="rv-target"></select>
        <label for="rv-note">Request note (what you're asking for — send only)</label>
        <input type="text" id="rv-note" placeholder="e.g. pacing and dialogue in acts 2-3" />
        <label for="rv-body">Their feedback — paste from email/doc (optional with a file)</label>
        <textarea id="rv-body"></textarea>
        <label for="rv-file">Attach the file they sent back (optional)</label>
        <input type="file" id="rv-file" />
        <div class="dialog-actions">
          <button type="button" id="rv-send" class="primary">Send for review</button>
          <span>
            <button type="button" id="rv-close">Close</button>
            <button type="submit" class="primary">Record received feedback</button>
          </span>
        </div>
      </form>
      <div class="ai-list" id="rv-list"></div>
    </dialog>

    <dialog id="editions-dialog">
      <strong>Editions</strong>
      <div class="ed-head">
        <select id="ed-select"></select>
        <button id="ed-new">New</button>
        <button id="ed-rename">Rename</button>
        <button id="ed-delete" class="danger">Delete</button>
      </div>
      <div id="ed-body" style="display: none">
        <div class="ed-downloads">
          <span style="color: var(--muted)">Download this edition:</span>
          <a id="ed-dl-epub" download>EPUB</a>
          <a id="ed-dl-docx" download>DOCX</a>
          <a id="ed-dl-pdf" download>PDF</a>
        </div>
        <div class="ed-section">Included, in order</div>
        <div id="ed-included"></div>
        <div class="ed-section">Available chapters</div>
        <div id="ed-available"></div>
      </div>
      <div class="dialog-actions">
        <span></span>
        <button type="button" id="ed-close">Close</button>
      </div>
    </dialog>

    <dialog id="meta-dialog">
      <form id="meta-form">
        <strong>metadata.yaml</strong>
        <label for="meta-content">EPUB/DOCX metadata for this project (YAML)</label>
        <textarea id="meta-content"></textarea>
        <div class="dialog-actions">
          <span></span>
          <span>
            <button type="button" id="meta-cancel">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </span>
        </div>
      </form>
    </dialog>

    <dialog id="editor">
      <form method="dialog" id="editor-form">
        <label for="edit-title">Title</label>
        <input type="text" id="edit-title" required />
        <label for="edit-notes">Notes</label>
        <textarea id="edit-notes" placeholder="Status, feedback to address, next steps…"></textarea>
        <label for="edit-file">Linked file</label>
        <input type="text" id="edit-file" placeholder="content/01-chapter.md" />
        <label>Tasks</label>
        <div id="task-list"></div>
        <input
          type="text"
          id="task-new"
          placeholder="Add a task (from editor notes, reviews…) — Enter to save"
        />
        <div class="dialog-actions">
          <button type="button" class="danger" id="edit-delete">Delete</button>
          <span>
            <button type="button" id="edit-cancel">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </span>
        </div>
      </form>
    </dialog>

    <script>
      const projectId = Number(location.pathname.split('/')[2]);
      const base = `/api/p/${projectId}`;
      let state = { stages: [], cards: [] };
      let editing = null;

      const api = async (path, method = 'GET', body) => {
        const res = await fetch(path, {
          method,
          headers: body ? { 'Content-Type': 'application/json' } : {},
          body: body ? JSON.stringify(body) : undefined
        });
        if (!res.ok) throw new Error((await res.json()).error || res.statusText);
        return res.json();
      };

      const load = async () => {
        const board = await api(`${base}/board`);
        state = board;
        document.getElementById('project-name').textContent = board.project.name;
        document.getElementById('project-path').textContent = board.project.path;
        document.title = board.project.name + ' · draftsync board';
        const drive = document.getElementById('am-drive');
        if (board.project.driveFolderUrl) {
          drive.href = board.project.driveFolderUrl;
          drive.style.display = '';
        }
        for (const fmt of ['epub', 'docx', 'pdf']) {
          document.getElementById(`dl-${fmt}`).href = `${base}/export/${fmt}`;
        }
        render();
      };

      const render = () => {
        const root = document.getElementById('board');
        root.innerHTML = '';
        for (const stage of state.stages) {
          const chapters = state.chapters.filter(c => c.stage === stage.key);
          const col = document.createElement('div');
          col.className = 'column';

          const h = document.createElement('h2');
          h.innerHTML = `<span>${stage.label}</span><span>${chapters.length}</span>`;
          col.appendChild(h);

          const list = document.createElement('div');
          list.className = 'cards';
          list.dataset.stage = stage.key;
          list.addEventListener('dragover', e => {
            e.preventDefault();
            list.classList.add('dragover');
          });
          list.addEventListener('dragleave', () => list.classList.remove('dragover'));
          list.addEventListener('drop', onDrop);

          for (const chapter of chapters) {
            const el = document.createElement('div');
            el.className = 'card';
            el.draggable = true;
            el.dataset.id = chapter.id;
            el.textContent = chapter.title;
            if (chapter.excerpt) {
              const ex = document.createElement('span');
              ex.className = 'excerpt';
              ex.textContent = chapter.excerpt;
              el.appendChild(ex);
            }
            if (chapter.word_count != null && chapter.file) {
              const w = document.createElement('span');
              w.className = 'words';
              w.textContent = `${chapter.word_count.toLocaleString()} words`;
              el.appendChild(w);
            }
            if (chapter.gdocUrl) {
              const g = document.createElement('a');
              g.className = 'gdoc';
              g.href = chapter.gdocUrl;
              g.target = '_blank';
              g.textContent = 'Google Doc ↗';
              g.addEventListener('click', e => e.stopPropagation());
              el.appendChild(g);
            }
            const openTasks = (state.tasks && state.tasks.openByChapter[chapter.id]) || 0;
            if (openTasks > 0) {
              const t = document.createElement('span');
              t.className = 'task-chip';
              t.textContent = `☐ ${openTasks}`;
              el.appendChild(t);
            }
            const aiCount = (state.ai && state.ai.byChapter[chapter.id]) || 0;
            if (aiCount > 0) {
              const chip = document.createElement('span');
              chip.className = 'ai-chip';
              chip.textContent = `AI ${aiCount}`;
              el.appendChild(chip);
            }
            if (chapter.file) {
              const f = document.createElement('span');
              f.className = 'file';
              f.textContent = chapter.file;
              el.appendChild(f);
            }
            el.addEventListener('dragstart', () => el.classList.add('dragging'));
            el.addEventListener('dragend', () => el.classList.remove('dragging'));
            el.addEventListener('click', () => openEditor(chapter));
            list.appendChild(el);
          }
          col.appendChild(list);

          const add = document.createElement('button');
          add.className = 'add';
          add.textContent = '+ Add chapter';
          add.addEventListener('click', () => addCard(list, stage.key, add));
          col.appendChild(add);

          root.appendChild(col);
        }
        if (state.chapters.length === 0) {
          const hint = document.createElement('div');
          hint.className = 'empty';
          hint.textContent =
            'No chapters yet — add one, or use "Import chapters" to seed the board from content/.';
          root.appendChild(hint);
        }
      };

      const onDrop = async e => {
        e.preventDefault();
        const list = e.currentTarget;
        list.classList.remove('dragover');
        const dragged = document.querySelector('.card.dragging');
        if (!dragged) return;
        const chaptersBelow = [...list.querySelectorAll('.card:not(.dragging)')];
        const index = chaptersBelow.filter(c => {
          const r = c.getBoundingClientRect();
          return e.clientY > r.top + r.height / 2;
        }).length;
        await api(`${base}/chapters/${dragged.dataset.id}`, 'PATCH', {
          stage: list.dataset.stage,
          index
        });
        load();
      };

      const addCard = (list, stage, addButton) => {
        if (list.querySelector('.add-input')) return;
        const input = document.createElement('input');
        input.className = 'add-input';
        input.placeholder = 'Chapter title…';
        const done = async commit => {
          const title = input.value.trim();
          input.remove();
          if (commit && title) {
            await api(`${base}/chapters`, 'POST', { title, stage });
            load();
          }
        };
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') done(true);
          if (e.key === 'Escape') done(false);
        });
        input.addEventListener('blur', () => done(true));
        list.parentElement.insertBefore(input, addButton);
        input.focus();
      };

      const renderTasks = async () => {
        const { tasks } = await api(`${base}/tasks`);
        const mine = tasks.filter(t => t.chapter_id === editing.id);
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        for (const t of mine) {
          const row = document.createElement('div');
          row.className = 'task' + (t.done ? ' done' : '');
          const check = document.createElement('input');
          check.type = 'checkbox';
          check.checked = !!t.done;
          check.addEventListener('change', async () => {
            await api(`${base}/tasks/${t.id}`, 'PATCH', { done: check.checked });
            renderTasks();
            load();
          });
          const text = document.createElement('span');
          text.textContent = t.text;
          const del = document.createElement('button');
          del.textContent = '×';
          del.addEventListener('click', async () => {
            await api(`${base}/tasks/${t.id}`, 'DELETE');
            renderTasks();
            load();
          });
          row.append(check, text, del);
          list.appendChild(row);
        }
      };

      const openEditor = chapter => {
        editing = chapter;
        document.getElementById('edit-title').value = chapter.title;
        document.getElementById('edit-notes').value = chapter.notes || '';
        document.getElementById('edit-file').value = chapter.file || '';
        renderTasks();
        document.getElementById('editor').showModal();
      };

      document.getElementById('task-new').addEventListener('keydown', async e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const text = e.target.value.trim();
        if (!text) return;
        await api(`${base}/tasks`, 'POST', { text, chapter_id: editing.id });
        e.target.value = '';
        renderTasks();
        load();
      });

      const openMetadata = async () => {
        const meta = await api(`${base}/metadata`);
        document.getElementById('meta-content').value = meta.content;
        document.getElementById('meta-dialog').showModal();
      };
      document
        .getElementById('meta-cancel')
        .addEventListener('click', () => document.getElementById('meta-dialog').close());
      document.getElementById('meta-form').addEventListener('submit', async e => {
        e.preventDefault();
        await api(`${base}/metadata`, 'PUT', {
          content: document.getElementById('meta-content').value
        });
        document.getElementById('meta-dialog').close();
      });

      document.getElementById('editor-form').addEventListener('submit', async () => {
        await api(`${base}/chapters/${editing.id}`, 'PATCH', {
          title: document.getElementById('edit-title').value,
          notes: document.getElementById('edit-notes').value,
          file: document.getElementById('edit-file').value || null
        });
        load();
      });
      document
        .getElementById('edit-cancel')
        .addEventListener('click', () => document.getElementById('editor').close());
      document.getElementById('edit-delete').addEventListener('click', async () => {
        if (!confirm('Delete this chapter?')) return;
        await api(`${base}/chapters/${editing.id}`, 'DELETE');
        document.getElementById('editor').close();
        load();
      });
      const doImport = async () => {
        try {
          const result = await api(`${base}/import`, 'POST');
          if (result.imported === 0) alert('Nothing new to import from content/.');
          load();
        } catch (e) {
          alert(e.message);
        }
      };

      const renderAiDialog = async () => {
        const { events, purposes } = await api(`${base}/ai-events`);
        const purposeSel = document.getElementById('ai-purpose');
        purposeSel.innerHTML = purposes.map(p => `<option value="${p}">${p}</option>`).join('');
        const cardSel = document.getElementById('ai-card');
        cardSel.innerHTML =
          '<option value="">Project-wide</option>' +
          state.chapters.map(c => `<option value="${c.id}">${c.title}</option>`).join('');
        const cardTitle = id => {
          const c = state.chapters.find(x => x.id === id);
          return c ? c.title : null;
        };
        const list = document.getElementById('ai-list');
        list.innerHTML = '';
        for (const e of events) {
          const div = document.createElement('div');
          div.className = 'ai-event';
          const del = document.createElement('button');
          del.textContent = 'Remove';
          del.addEventListener('click', async () => {
            await api(`${base}/ai-events/${e.id}`, 'DELETE');
            renderAiDialog();
            load();
          });
          div.appendChild(del);
          const head = document.createElement('div');
          head.textContent = `${e.purpose} — ${e.provider} (${e.source})`;
          div.appendChild(head);
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = [
            cardTitle(e.chapter_id) || e.file || 'project-wide',
            e.model,
            e.tokens_out ? `${e.tokens_in}→${e.tokens_out} tok` : null,
            e.occurred_at ? e.occurred_at.slice(0, 10) : null
          ]
            .filter(Boolean)
            .join(' · ');
          div.appendChild(meta);
          if (e.url) {
            const a = document.createElement('a');
            a.href = e.url;
            a.target = '_blank';
            a.textContent = e.url;
            div.appendChild(a);
          }
          if (e.justification) {
            const j = document.createElement('div');
            j.className = 'just';
            j.textContent = e.justification;
            div.appendChild(j);
          }
          list.appendChild(div);
        }
      };

      const openAi = async () => {
        await renderAiDialog();
        document.getElementById('ai-dialog').showModal();
      };
      document
        .getElementById('ai-close')
        .addEventListener('click', () => document.getElementById('ai-dialog').close());
      document.getElementById('ai-form').addEventListener('submit', async e => {
        e.preventDefault();
        try {
          await api(`${base}/ai-events`, 'POST', {
            url: document.getElementById('ai-url').value || undefined,
            purpose: document.getElementById('ai-purpose').value,
            chapter_id: document.getElementById('ai-card').value || undefined,
            justification: document.getElementById('ai-just').value
          });
          document.getElementById('ai-url').value = '';
          document.getElementById('ai-just').value = '';
          renderAiDialog();
          load();
        } catch (err) {
          alert(err.message);
        }
      });
      document.getElementById('ai-ingest').addEventListener('click', async () => {
        const result = await api(`${base}/ai-ingest`, 'POST');
        alert(
          result.found === 0
            ? 'No Claude Code transcripts found for this project.'
            : `Ingested ${result.found} session(s): ${result.created} new, ${result.updated} refreshed.`
        );
        renderAiDialog();
        load();
      });

      let currentEdition = null;

      const renderEditions = async keepId => {
        const { editions } = await api(`${base}/editions`);
        const sel = document.getElementById('ed-select');
        sel.innerHTML = editions.length
          ? editions
              .map(e => `<option value="${e.id}">${e.name} (${e.chapterCount})</option>`)
              .join('')
          : '<option value="">No editions yet — create one</option>';
        if (keepId && editions.some(e => e.id === keepId)) sel.value = keepId;
        currentEdition = Number(sel.value) || null;
        document.getElementById('ed-body').style.display = currentEdition ? '' : 'none';
        if (currentEdition) renderEditionDetail();
      };

      const renderEditionDetail = async () => {
        const { chapters } = await api(`${base}/editions/${currentEdition}`);
        for (const fmt of ['epub', 'docx', 'pdf']) {
          document.getElementById(`ed-dl-${fmt}`).href =
            `${base}/export/${fmt}?edition=${currentEdition}`;
        }
        const ids = chapters.map(c => c.id);
        const setChapters = async newIds => {
          await api(`${base}/editions/${currentEdition}/chapters`, 'PUT', { chapter_ids: newIds });
          renderEditions(currentEdition);
        };

        const included = document.getElementById('ed-included');
        included.innerHTML = '';
        chapters.forEach((c, i) => {
          const row = document.createElement('div');
          row.className = 'ed-row';
          const up = document.createElement('button');
          up.textContent = '▲';
          up.disabled = i === 0;
          up.addEventListener('click', () => {
            const next = [...ids];
            [next[i - 1], next[i]] = [next[i], next[i - 1]];
            setChapters(next);
          });
          const down = document.createElement('button');
          down.textContent = '▼';
          down.disabled = i === ids.length - 1;
          down.addEventListener('click', () => {
            const next = [...ids];
            [next[i], next[i + 1]] = [next[i + 1], next[i]];
            setChapters(next);
          });
          const t = document.createElement('span');
          t.className = 't';
          t.textContent = `${i + 1}. ${c.title}`;
          row.append(up, down, t);
          if (!c.file) {
            const nf = document.createElement('span');
            nf.className = 'nofile';
            nf.textContent = 'no file — skipped in builds';
            row.appendChild(nf);
          }
          const rm = document.createElement('button');
          rm.textContent = '×';
          rm.addEventListener('click', () => setChapters(ids.filter(x => x !== c.id)));
          row.appendChild(rm);
          included.appendChild(row);
        });
        if (chapters.length === 0) {
          included.innerHTML =
            '<div class="ed-row excluded"><span class="t">Empty — add chapters below</span></div>';
        }

        const available = document.getElementById('ed-available');
        available.innerHTML = '';
        for (const c of state.chapters.filter(c => !ids.includes(c.id))) {
          const row = document.createElement('div');
          row.className = 'ed-row excluded';
          const add = document.createElement('button');
          add.textContent = '+';
          add.addEventListener('click', () => setChapters([...ids, c.id]));
          const t = document.createElement('span');
          t.className = 't';
          t.textContent = c.title;
          row.append(add, t);
          available.appendChild(row);
        }
      };

      const openEditions = async newFirst => {
        await renderEditions();
        document.getElementById('editions-dialog').showModal();
        if (newFirst) document.getElementById('ed-new').click();
      };
      document.getElementById('ed-select').addEventListener('change', e => {
        currentEdition = Number(e.target.value) || null;
        document.getElementById('ed-body').style.display = currentEdition ? '' : 'none';
        if (currentEdition) renderEditionDetail();
      });
      document.getElementById('ed-new').addEventListener('click', async () => {
        const name = prompt('Edition name (e.g. "Reader\u2019s Edition"):');
        if (!name || !name.trim()) return;
        try {
          const edition = await api(`${base}/editions`, 'POST', { name: name.trim() });
          renderEditions(edition.id);
        } catch (e) {
          alert(e.message);
        }
      });
      document.getElementById('ed-rename').addEventListener('click', async () => {
        if (!currentEdition) return;
        const name = prompt('New name:');
        if (!name || !name.trim()) return;
        await api(`${base}/editions/${currentEdition}`, 'PATCH', { name: name.trim() });
        renderEditions(currentEdition);
      });
      document.getElementById('ed-delete').addEventListener('click', async () => {
        if (!currentEdition) return;
        if (!confirm('Delete this edition? (Chapters themselves are not deleted.)')) return;
        await api(`${base}/editions/${currentEdition}`, 'DELETE');
        renderEditions();
      });
      document
        .getElementById('ed-close')
        .addEventListener('click', () => document.getElementById('editions-dialog').close());

      const TYPE_LABELS = {
        file_edited: 'file edited',
        review_sent: 'sent for review',
        review_received: 'review received',
        task_created: 'task',
        task_completed: 'task done',
        chapter_created: 'chapter',
        edition_created: 'edition'
      };

      const describeActivity = a => {
        const d = a.data || {};
        switch (a.type) {
          case 'file_edited':
            return `${a.chapterTitle || d.file} — +${d.linesAdded}/−${d.linesRemoved} lines, now ${d.wordCount} words`;
          case 'review_sent':
            return `to ${d.reviewer}` + (a.chapterTitle ? ` — ${a.chapterTitle}` : '');
          case 'review_received':
            return (
              `from ${d.reviewer}` +
              (a.chapterTitle ? ` on ${a.chapterTitle}` : '') +
              (d.hasFile ? ' (file attached)' : '')
            );
          case 'task_created':
          case 'task_completed':
            return d.text + (a.chapterTitle ? ` — ${a.chapterTitle}` : '');
          case 'chapter_created':
            return d.title + (d.imported ? ' (imported)' : '');
          case 'edition_created':
            return d.name;
          default:
            return JSON.stringify(d);
        }
      };

      const renderReviews = async () => {
        const { reviews } = await api(`${base}/reviews`);
        const { editions } = await api(`${base}/editions`);
        const target = document.getElementById('rv-target');
        target.innerHTML =
          state.chapters
            .map(c => `<option value="c:${c.id}">Chapter: ${c.title}</option>`)
            .join('') +
          editions.map(e => `<option value="e:${e.id}">Edition: ${e.name}</option>`).join('');
        const list = document.getElementById('rv-list');
        list.innerHTML = '';
        for (const rv of reviews) {
          const div = document.createElement('div');
          div.className = 'ai-event';
          if (rv.status === 'sent') {
            const receive = document.createElement('button');
            receive.textContent = 'Record feedback';
            receive.style.float = 'right';
            receive.addEventListener('click', () => {
              fulfilling = rv.id;
              document.getElementById('rv-name').value = rv.reviewer_name;
              document.getElementById('rv-email').value = rv.reviewer_email;
              document.getElementById('rv-body').focus();
            });
            div.appendChild(receive);
          }
          const head = document.createElement('div');
          head.textContent = `${rv.status === 'sent' ? '⏳ awaiting' : '✓ received'} — ${rv.reviewer_name} <${rv.reviewer_email}> — ${
            rv.chapterTitle ? 'chapter: ' + rv.chapterTitle : 'edition: ' + rv.editionName
          }`;
          div.appendChild(head);
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent =
            (rv.status === 'sent'
              ? `sent ${(rv.sent_at || '').slice(0, 16)}`
              : `received ${(rv.received_at || '').slice(0, 16)}`) +
            (rv.request_note ? ` · asked: ${rv.request_note}` : '') +
            (rv.file ? ` · file: ${rv.file}` : '');
          div.appendChild(meta);
          if (rv.body) {
            const bodyEl = document.createElement('div');
            bodyEl.className = 'just';
            bodyEl.textContent = rv.body;
            div.appendChild(bodyEl);
          }
          list.appendChild(div);
        }
      };

      let fulfilling = null;
      const reviewTarget = () => {
        const [kind, targetId] = document.getElementById('rv-target').value.split(':');
        return kind === 'c' ? { chapter_id: Number(targetId) } : { edition_id: Number(targetId) };
      };

      document.getElementById('rv-send').addEventListener('click', async () => {
        try {
          await api(`${base}/reviews/request`, 'POST', {
            ...reviewTarget(),
            reviewer_name: document.getElementById('rv-name').value,
            reviewer_email: document.getElementById('rv-email').value,
            request_note: document.getElementById('rv-note').value || undefined
          });
          document.getElementById('rv-note').value = '';
          renderReviews();
        } catch (err) {
          alert(err.message);
        }
      });

      const openReviews = async focusField => {
        await renderReviews();
        document.getElementById('reviews-dialog').showModal();
        if (focusField) document.getElementById(focusField).focus();
      };
      document
        .getElementById('rv-close')
        .addEventListener('click', () => document.getElementById('reviews-dialog').close());

      document.getElementById('review-form').addEventListener('submit', async e => {
        e.preventDefault();
        const payload = fulfilling
          ? { review_id: fulfilling, body: document.getElementById('rv-body').value || undefined }
          : {
              ...reviewTarget(),
              reviewer_name: document.getElementById('rv-name').value,
              reviewer_email: document.getElementById('rv-email').value,
              body: document.getElementById('rv-body').value || undefined
            };
        const fileInput = document.getElementById('rv-file');
        if (fileInput.files[0]) {
          const file = fileInput.files[0];
          payload.file_name = file.name;
          payload.file_base64 = await new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(file);
          });
        }
        try {
          await api(`${base}/reviews`, 'POST', payload);
          fulfilling = null;
          document.getElementById('rv-body').value = '';
          fileInput.value = '';
          renderReviews();
        } catch (err) {
          alert(err.message);
        }
      });

      /* ----- dropdown menus ----- */
      for (const menu of document.querySelectorAll('.menu')) {
        menu.querySelector(':scope > button').addEventListener('click', e => {
          e.stopPropagation();
          const was = menu.classList.contains('open');
          document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
          if (!was) menu.classList.add('open');
        });
      }
      document.addEventListener('click', () =>
        document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'))
      );

      const refreshMenuCounts = async () => {
        const [{ reviews }, { editions }] = await Promise.all([
          api(`${base}/reviews`),
          api(`${base}/editions`)
        ]);
        const awaiting = reviews.filter(r => r.status === 'sent').length;
        document.getElementById('am-reviews-count').textContent =
          awaiting > 0 ? `${awaiting} awaiting` : `${reviews.length}`;
        document.getElementById('am-editions-count').textContent = editions.length;
      };

      document
        .getElementById('am-reviews-head')
        .addEventListener('click', () => setPanel('reviews', true));
      document.getElementById('am-send').addEventListener('click', () => openReviews('rv-name'));
      document.getElementById('am-record').addEventListener('click', () => openReviews('rv-body'));
      document
        .getElementById('am-editions-head')
        .addEventListener('click', () => openEditions(false));
      document.getElementById('am-new-edition').addEventListener('click', () => openEditions(true));
      document.getElementById('am-metadata').addEventListener('click', openMetadata);
      document.getElementById('am-import').addEventListener('click', doImport);
      document.getElementById('am-ai').addEventListener('click', openAi);
      document.getElementById('dl-editions').addEventListener('click', () => openEditions(false));

      /* ----- activity panel ----- */
      const CAT = {
        file_edited: 'files',
        chapter_created: 'files',
        edition_created: 'files',
        review_sent: 'reviews',
        review_received: 'reviews',
        task_created: 'tasks',
        task_completed: 'tasks',
        ai_event: 'ai'
      };
      let panelCat = 'all';
      let streamRows = [];

      const describeStreamRow = row => {
        if (row.kind !== 'ai_event') {
          return describeActivity({
            type: row.kind,
            data: row.data,
            chapterTitle: row.chapterTitle
          });
        }
        const d = row.data;
        let text = `${d.purpose} — ${d.provider} (${d.source})`;
        if (row.chapterTitle) text += ` · ${row.chapterTitle}`;
        return text;
      };

      const renderStream = () => {
        const list = document.getElementById('apanel-list');
        list.innerHTML = '';
        const rows = streamRows.filter(r => panelCat === 'all' || CAT[r.kind] === panelCat);
        if (rows.length === 0) {
          list.innerHTML = '<div class="st-item"><span class="what">Nothing here yet.</span></div>';
          return;
        }
        for (const row of rows) {
          const item = document.createElement('div');
          item.className = 'st-item';
          const when = document.createElement('span');
          when.className = 'when';
          when.textContent = String(row.at || '')
            .replace('T', ' ')
            .slice(5, 16);
          const kind = document.createElement('span');
          kind.className = 'kind' + (CAT[row.kind] === 'ai' ? ' ai' : '');
          kind.textContent = row.kind === 'ai_event' ? 'ai' : TYPE_LABELS[row.kind] || row.kind;
          const what = document.createElement('span');
          what.className = 'what';
          what.textContent = describeStreamRow(row);
          if (row.kind === 'ai_event') {
            const mark = document.createElement('span');
            if (row.data.purpose === 'prose-suggestion' && !row.data.justification) {
              mark.className = 'warn';
              mark.textContent = ' ⚠';
            } else if (row.data.justification) {
              mark.className = 'ok';
              mark.textContent = ' ✓';
            }
            what.appendChild(mark);
          }
          item.append(when, kind, what);
          list.appendChild(item);
        }
      };

      const loadStream = async () => {
        streamRows = (await api(`${base}/activity`)).stream;
        renderStream();
      };

      const setPanel = (cat, open) => {
        panelCat = cat;
        for (const chip of document.querySelectorAll('.chipbtn')) {
          chip.classList.toggle('active', chip.dataset.cat === cat);
        }
        if (open) {
          document.body.classList.add('panel-open');
          localStorage.setItem('draftsync-panel', '1');
        }
        loadStream();
      };

      for (const chip of document.querySelectorAll('.chipbtn')) {
        chip.addEventListener('click', () => setPanel(chip.dataset.cat, true));
      }
      document.getElementById('panel-toggle').addEventListener('click', () => {
        const open = document.body.classList.toggle('panel-open');
        localStorage.setItem('draftsync-panel', open ? '1' : '');
        if (open) loadStream();
      });
      document.getElementById('ap-send').addEventListener('click', () => openReviews('rv-name'));
      document.getElementById('ap-record').addEventListener('click', () => openReviews('rv-body'));
      document.getElementById('ap-ai').addEventListener('click', openAi);
      if (localStorage.getItem('draftsync-panel')) {
        document.body.classList.add('panel-open');
        loadStream();
      }

      // Refresh file stats on page load, then render the board
      (async () => {
        try {
          await api(`${base}/scan`, 'POST');
        } catch {
          /* board still renders without a scan */
        }
        load();
        refreshMenuCounts();
        if (document.body.classList.contains('panel-open')) loadStream();
      })();
    </script>
  </body>
</html>
