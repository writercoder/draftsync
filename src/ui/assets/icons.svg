<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
  <!-- draftsync icon set — 16px grid, stroke currentColor 1.5, round caps.
       Zone color comes from the referencing element's `color`. -->
  <defs>
    <g id="stroke-base" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <symbol id="edit" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11.3 3.2l1.5 1.5M3.8 12.7l.5-2.5 7-7 2 2-7 7-2.5.5z"/>
    </g>
  </symbol>

  <symbol id="doc-plus" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="2" width="9" height="12" rx="1.5"/>
      <path d="M8 6v4M6 8h4"/>
    </g>
  </symbol>

  <symbol id="layers" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2.5L14 5.5 8 8.5 2 5.5z"/>
      <path d="M2 8.5l6 3 6-3"/>
      <path d="M2 11.5l6 3 6-3"/>
    </g>
  </symbol>

  <symbol id="plane" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8.4L14 2 9.2 14 7.2 9.6 2 8.4z"/>
      <path d="M7.2 9.6L14 2"/>
    </g>
  </symbol>

  <symbol id="inbox" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2v5.5M6 5.7L8 7.7l2-2"/>
      <path d="M2.5 9.5V12a1.5 1.5 0 001.5 1.5h8A1.5 1.5 0 0013.5 12V9.5"/>
      <path d="M2.5 9.5h3l1 1.5h3l1-1.5h3"/>
    </g>
  </symbol>

  <symbol id="square" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <rect x="2.75" y="2.75" width="10.5" height="10.5" rx="2"/>
    </g>
  </symbol>

  <symbol id="square-check" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.75" y="2.75" width="10.5" height="10.5" rx="2"/>
      <path d="M5.4 8.2l1.9 1.9 3.4-4"/>
    </g>
  </symbol>

  <symbol id="sparkle" viewBox="0 0 16 16">
    <path fill="currentColor" d="M8 1.5l1.4 4.6L14 7.5l-4.6 1.4L8 13.5 6.6 8.9 2 7.5l4.6-1.4L8 1.5z"/>
    <circle fill="currentColor" cx="12.9" cy="12.4" r="1.4"/>
  </symbol>

  <symbol id="sliders" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/>
      <circle cx="10.5" cy="4.5" r="1.7" fill="var(--paper-raised, #fff)"/>
      <circle cx="5.5" cy="8" r="1.7" fill="var(--paper-raised, #fff)"/>
      <circle cx="11.5" cy="11.5" r="1.7" fill="var(--paper-raised, #fff)"/>
    </g>
  </symbol>

  <symbol id="import" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2v7.5M5.2 6.7L8 9.5l2.8-2.8"/>
      <path d="M2.5 13.5h11"/>
    </g>
  </symbol>

  <symbol id="download" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2.5v7M5.4 6.7L8 9.3l2.6-2.6"/>
      <path d="M3 12h10a0 0 0 000 0"/>
      <path d="M2.5 12v1.5h11V12"/>
    </g>
  </symbol>

  <symbol id="pulse" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1.5 8.5h3L6.5 4l3 8.5L11.5 8h3"/>
